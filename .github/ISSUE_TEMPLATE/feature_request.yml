name: Feature request
description: Suggest a focused improvement to MusicVault.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user problem rather than only a proposed implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Risks or trade-offs
      description: Note privacy, platform-policy, usability, or maintenance implications.
    validations:
      required: false
