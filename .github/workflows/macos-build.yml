name: macOS build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build MusicVault for macOS Apple Silicon
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          architecture: arm64
      - name: Build app bundle and disk image
        run: bash ./scripts/build_macos.sh
      - name: Upload macOS installer
        uses: actions/upload-artifact@v7
        with:
          name: musicvault-macos-arm64
          path: |
            dist/MusicVault-macos-arm64.dmg
            THIRD_PARTY_NOTICES.txt
          if-no-files-found: error
          retention-days: 14
      - name: Attach macOS package to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..40}; do
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" dist/MusicVault-macos-arm64.dmg THIRD_PARTY_NOTICES.txt --repo "$GITHUB_REPOSITORY" --clobber
              exit 0
            fi
            echo "Waiting for the Windows workflow to create the tagged release (attempt $attempt/40)."
            sleep 15
          done
          echo "The tagged GitHub Release was not created within 10 minutes." >&2
          exit 1
