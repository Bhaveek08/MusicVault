name: Mobile UI and target readiness

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "tests/test_mobile_ui.py"
      - "tests/mobile_shared_ui.test.cjs"
      - "scripts/capture_ui_previews.py"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "tests/test_mobile_ui.py"
      - "tests/mobile_shared_ui.test.cjs"
      - "scripts/capture_ui_previews.py"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-policy:
    name: Mobile source and URL policy tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Test YouTube/Spotify URL policy and mobile source boundaries
        run: python -m pytest -q tests/test_mobile_ui.py
      - name: Test shared WebView button interactions and error states
        run: node tests/mobile_shared_ui.test.cjs

  ui-preview:
    name: Render current desktop and mobile UI previews
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install X11 and Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0
      - name: Install MusicVault UI dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Render current UI screenshots using virtual X11
        run: xvfb-run -a python scripts/capture_ui_previews.py --output artifacts/ui-preview
      - name: Upload UI preview images
        uses: actions/upload-artifact@v4
        with:
          name: musicvault-ui-previews
          path: artifacts/ui-preview/*.png
          if-no-files-found: error
          retention-days: 30
      - name: Publish review PNGs in docs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p docs/ui-preview
            cp artifacts/ui-preview/*.png docs/ui-preview/
            git add docs/ui-preview/*.png
            if git diff --cached --quiet; then
              echo "UI preview images are unchanged."
              exit 0
            fi
            git commit -m "docs: refresh MusicVault UI preview screenshots"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Main advanced during screenshot publish; retrying against the latest branch."
          done
          echo "Could not publish UI preview screenshots after five retries."
          exit 1

  android-build-link:
    name: Android native build workflow
    runs-on: ubuntu-22.04
    steps:
      - name: Point to native APK and emulator tests
        run: |
          echo "Native Android APK builds and emulator smoke tests run in .github/workflows/mobile-build.yml."
          echo "This workflow contains shared UI policy tests only."

  ios-host-tests:
    name: iOS shared UI host checks
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify Xcode and iOS Simulator SDK
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
      - name: Install host Qt for Python test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Verify mobile validation and UI imports
        run: |
          python -c "from mobile.app.source_validation import validate_youtube_link; from mobile.app.main import MusicVaultMobileWindow; assert validate_youtube_link('https://youtu.be/BaW_jenozKc') == 'video'; print(MusicVaultMobileWindow.__name__)"
      - name: Record native iOS build location
        run: |
          echo "Native iOS Simulator builds and simulator launch smoke tests run in .github/workflows/mobile-build.yml."
          echo "A physical-device IPA still requires an Apple Developer Team and signing profile."
