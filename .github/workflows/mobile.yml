name: Mobile UI and target readiness

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "tests/test_mobile_ui.py"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "tests/test_mobile_ui.py"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-ui:
    name: Mobile UI policy tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0
      - name: Install UI test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Test mobile URL policy and UI structure
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests/test_mobile_ui.py

  android-deploy-preflight:
    name: Android deploy attempt (license-gated)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Linux Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdouble-conversion3
      - name: Install Qt for Python deploy tools
        run: python -m pip install PySide6==6.12.0 qtpip
      - name: Attempt Android target wheel download
        id: android_wheels
        working-directory: mobile
        continue-on-error: true
        run: |
          qtpip download PySide6 --android --arch aarch64
          qtpip download shiboken6 --android --arch aarch64
      - name: Report Android deployment status
        if: always()
        env:
          ANDROID_WHEEL_RESULT: ${{ steps.android_wheels.outcome }}
        run: |
          if [ "$ANDROID_WHEEL_RESULT" = "success" ]; then
            echo "Android target wheels were retrieved."
            echo "No APK/AAB was built in this workflow."
          else
            echo "::warning::Android wheel/deploy preflight is blocked by Qt deployment licensing/toolchain configuration. No APK/AAB was built."
          fi

  ios-toolchain-check:
    name: iOS deployment toolchain check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify Xcode and iOS SDK are available
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version
      - name: Install open-source Qt for Python host wheels
        run: python -m pip install PySide6==6.12.0
      - name: Verify shared mobile validation and UI imports
        working-directory: .
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -c "from mobile.app.source_validation import validate_youtube_link; from mobile.app.main import MusicVaultMobileWindow; assert validate_youtube_link('https://youtu.be/BaW_jenozKc') == 'video'; print(MusicVaultMobileWindow.__name__)"
      - name: Record iOS deployment boundary
        run: |
          echo "Xcode and iOS Simulator SDK are present."
          echo "No iOS target wheel/Xcode project/IPA is built in this workflow."
          echo "The desktop media pipeline still needs a separate mobile-native port."
