name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run regression suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts/run_release_qa.py
      - name: Upload host QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: musicvault-qa-${{ matrix.os }}-py${{ matrix.python-version }}
          path: QA_REPORT.md
          if-no-files-found: warn
          retention-days: 30
