name: Windows build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build MusicVault for Windows x64
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Run release build
        shell: cmd
        run: |
          set CI=1
          scripts\build_windows.bat
      - name: Package Windows release ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist/MusicVault-Setup.exe, THIRD_PARTY_NOTICES.txt, QA_REPORT.md -DestinationPath dist/MusicVault-Windows-x64.zip -CompressionLevel Optimal -Force
      - name: Publish GitHub release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          gh release create $tag dist/MusicVault-Setup.exe dist/MusicVault-Windows-x64.zip THIRD_PARTY_NOTICES.txt QA_REPORT.md --title "MusicVault $tag" --generate-notes --verify-tag
      - name: Upload installer, ZIP and notices
        uses: actions/upload-artifact@v4
        with:
          name: musicvault-windows-x64
          path: |
            dist/MusicVault-Setup.exe
            dist/MusicVault-Windows-x64.zip
            THIRD_PARTY_NOTICES.txt
            QA_REPORT.md
          if-no-files-found: error
          retention-days: 14
