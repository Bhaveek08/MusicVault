name: Windows build

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the Windows installer as a GitHub Release
        required: true
        type: boolean
        default: false
      release_version:
        description: Version tag to create (for example v2.0.1)
        required: false
        type: string
        default: v2.0.1
  pull_request:
    paths:
      - ".github/workflows/windows-build.yml"
      - "musicvault_app.py"
      - "musicvault_core.py"
      - "requirements*.txt"
      - "scripts/build_windows.bat"
      - "installer/**"
      - "assets/**"
      - "README.md"
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build MusicVault for Windows x64
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Run release build
        shell: cmd
        run: |
          set CI=1
          scripts\build_windows.bat
      - name: Package Windows release ZIP
        shell: pwsh
        run: |
          $packageFiles = @(
            'dist/MusicVault-Setup.exe',
            'THIRD_PARTY_NOTICES.txt',
            'QA_REPORT.md'
          )
          Compress-Archive -Path $packageFiles -DestinationPath 'dist/MusicVault-Windows-x64.zip' -CompressionLevel Optimal -Force
      - name: Upload installer, ZIP and notices
        uses: actions/upload-artifact@v4
        with:
          name: musicvault-windows-x64
          path: |
            dist/MusicVault-Setup.exe
            dist/MusicVault-Windows-x64.zip
            THIRD_PARTY_NOTICES.txt
            QA_REPORT.md
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish tagged Windows release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out source for GitHub CLI
        uses: actions/checkout@v4
      - name: Download Windows release assets
        uses: actions/download-artifact@v4
        with:
          name: musicvault-windows-x64
          path: release-assets
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          $assets = @(
            'release-assets/dist/MusicVault-Setup.exe',
            'release-assets/dist/MusicVault-Windows-x64.zip',
            'release-assets/THIRD_PARTY_NOTICES.txt',
            'release-assets/QA_REPORT.md'
          )
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $tag = $env:RELEASE_VERSION
            $validTag = $tag.StartsWith('v')
            $versionParts = @()
            if ($validTag) {
              $versionParts = $tag.Substring(1).Split('.')
              $validTag = $versionParts.Length -eq 3
            }
            if ($validTag) {
              foreach ($part in $versionParts) {
                if ($part.Length -eq 0 -or $part -match '[^0-9]') {
                  $validTag = $false
                }
              }
            }
            if (-not $validTag) {
              throw "Release version must use the vX.Y.Z format."
            }
            gh release create $tag $assets --title "MusicVault $tag" --generate-notes --target $env:GITHUB_SHA
          } else {
            $tag = $env:GITHUB_REF_NAME
            gh release create $tag $assets --title "MusicVault $tag" --generate-notes --verify-tag
          }
