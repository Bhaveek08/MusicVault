plugins {
    id "com.android.application"
}

android {
    namespace "com.musicvault.mobile"
    compileSdk 35

    defaultConfig {
        applicationId "com.musicvault.mobile"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "0.2.0"
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDirs = ["src/main/assets", "../../shared"]
        }
    }
}
